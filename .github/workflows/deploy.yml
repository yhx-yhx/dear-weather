name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          VITE_QWEATHER_API_HOST: ${{ secrets.QWEATHER_API_HOST }}
          VITE_TDT_MAP_KEY: ${{ secrets.TDT_MAP_KEY }}
          VITE_PUSH_WORKER_URL: ${{ secrets.PUSH_WORKER_URL }}
          VITE_PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
